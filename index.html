<!DOCTYPE html>
<html lang="en">
    <head>
        <link rel="stylesheet" href="style.css">
        
    </head> 
    <body>
        <div class="container">
            <div >
                <h1 class = "header_text">OI, LINDO! VOCÊ MI PERDOA???</h1>
            </div>
            <div class="gif_container">
                <img src="gato.gif" alt="Cute animated illustration" width="300px"> 
            </div>
            <div class = "buttons">
                <button class="btn" id = "sim" onclick="nextPage()">Siimm! </button>
                <button class="btn" id="nao" onmouseover="fuja()">Não? </button>
                <script>
                    function nextPage() {
                        window.location.href = "yes.html";
                    }
                    
                    function fuja() {
                        var botaoNao = document.getElementById("nao")

                        var larguraJanela = window.innerWidth;
                        var alturaJanela = window.innerHeight;

                        var maxX = larguraJanela - botaoNao.offsetWidth;
                        var maxY = alturaJanela - botaoNao.offsetHeight;                        

                        var aleatorioX = Math.floor(Math.random() * maxX);
                        var aleatorioY = Math.floor(Math.random() * maxY);

                        botaoNao.style.left = aleatorioX + "px";
                        botaoNao.style.top = aleatorioY + "px";
                        
                    }
                </script> 
            </div>
        </div>
       
    </body> 
</html>
